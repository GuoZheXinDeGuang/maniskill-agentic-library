# Package ######################################################################

[build-system]
requires = ["setuptools >= 62.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mshab"
description = "ManiSkill-HAB"
readme = "README.md"
requires-python = ">= 3.8"
authors = [{ name = "Arth Shukla", email = "arshukla@ucsd.edu" }, { name = "Stone Tao", email = "stao@ucsd.edu" }, { name = "Hao Su", email = "haosu@ucsd.edu" }]
license = { text = "MIT License" }
keywords = ["Reinforcement Learning", "Robotics", "Jax", "RL", "AI"]
classifiers = [
    "Development Status :: 4 - Beta",  # change to `5 - Production/Stable` when ready
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]
dependencies = [
    "torch",
    "dacite",
    "shortuuid",
    "huggingface_hub[cli]"
]
dynamic = ["version"]

[project.optional-dependencies]

train = ["omegaconf", "wandb", "tensorboard", "tensorboardX", "diffusers", "msgpack", "torchvision"]
dev = ["ipdb", "jupyterlab", "ipython", "black", "isort"]
# The real model behind the proposer boundary (mshab/experiments/planning/deepseek.py):
# DeepSeek's API is OpenAI-compatible, so the openai SDK is the client. Tests never
# import it; only DeepSeekChat does, lazily.
planning = ["openai>=1.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mshab", "mshab.*"]

# Linters and Test tools #######################################################

[tool.black]
line-length = 88
safe = true

[tool.isort]
atomic = true
profile = "black"
src_paths = ["mshab", "scripts"]
extra_standard_library = ["typing_extensions"]
indent = 4
# -1 is isort's context-sensitive default (2 blank lines before a def/class,
# 1 otherwise), which is what black also produces. Pinning this to 2 makes the
# two tools undo each other forever: isort inserts the second blank line, black
# removes it, isort puts it back.
lines_after_imports = -1
multi_line_output = 3
line_length = 150
# FIRSTPARTY covers the repository's non-`mshab` top-level modules (`scripts`,
# imported by tests/test_set_table_graph_decisions.py). Leaving it out of a
# custom `sections` list is not a warning: isort aborts with
# "FIRSTPARTY was not included in the sections setting" on the first such import.
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "GYMNASIUM", "LEARNING", "SAPIEN", "MANI_SKILL", "DIFFUSERS", "MSHAB", "FIRSTPARTY", "LOCALFOLDER"]
known_mshab = ["mshab"]
known_diffusers = ["diffusers"]
known_mani_skill = ["mani_skill"]
known_sapien = ["sapien"]
known_learning = ["torch", "numpy", "transforms3d"]
known_gymnasium = ["gymnasium"]
known_third_party = ["wandb", "tensorboard", "tensorboardX", "omegaconf", "dacite", "torch"]