<text x="30" y="780" font-size="12" font-weight="400" fill="#71809b" text-anchor="start">box = one sub-goal (Layer 1) · fill: orange at(object, receptacle), purple holding(object), blue reachable(x), green open(x) / closed(x) · rows = skill nodes in the sub-goal's subgraph</text>
<text x="30" y="798" font-size="12" font-weight="400" fill="#71809b" text-anchor="start">dashed red = a predicate that is in neither gold graph; the sub-goal ids are the proposer's own</text>
