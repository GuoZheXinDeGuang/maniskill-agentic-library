<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="818" viewBox="0 0 1460 818" role="img" aria-labelledby="title description">
<title id="title">Layer-1 sub-goal chains</title>
<desc id="description">Gold SetTable decompositions next to every DeepSeek decomposition, one row per skill node.</desc>
<defs></defs>
<rect width="1460" height="818" fill="#ffffff"/>
<text x="30" y="40" font-size="26" font-weight="700" fill="#6842cb" text-anchor="start">Layer-1 sub-goal chains: gold references and DeepSeek decompositions</text>
<text x="30" y="66" font-size="14" font-weight="400" fill="#71809b" text-anchor="start">SetTable, two objects out of two storages · each column is one decomposition, top to bottom in execution order · a sub-goal spans one row per skill node of its subgraph</text>
<text x="30" y="88" font-size="13" font-weight="400" fill="#71809b" text-anchor="start">the goal does not say which storage holds which object; the gold graphs assume the official episode (bowl in the kitchen counter drawer, apple in the fridge);</text>
<text x="30" y="106" font-size="13" font-weight="400" fill="#71809b" text-anchor="start">a dashed red box is a predicate outside the gold vocabulary (0 of 0 in the DeepSeek columns)</text>
<rect x="30" y="204" width="1400" height="272" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="42" y="336.0" font-size="13" font-weight="700" fill="#2f3a4d" text-anchor="start">bowl_delivered</text>
<text x="42" y="354.0" font-size="11" font-weight="400" fill="#71809b" text-anchor="start">at(024_bowl,dining_table)</text>
